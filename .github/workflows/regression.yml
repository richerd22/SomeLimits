name: Regression checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Editor lifecycle tests (no dependencies)
        run: node tests/editor-runtime-regression.mjs
      - name: Classic blueprint, lift-crest continuation and elevation source regression (no dependencies)
        run: node tests/blueprint-editor-regression.mjs
      - name: Adjustable level turn and drop construction, exact classic defaults
        run: node tests/section-dimensions-regression.mjs
      - name: Precision node navigation, numeric coordinates and view-correct nudge axis
        run: node tests/precision-node-editor-regression.mjs
      - name: Draw track from SIDE/FRONT and preserve independent camera navigation (no dependencies)
        run: node tests/elevation-draw-regression.mjs
      - name: Opt-in drawing grid snapping and TOP point preview (no dependencies)
        run: node tests/drafting-snap-regression.mjs
      - name: Mobile DPR and lazy library regression (no dependencies)
        run: node tests/library-render-regression.mjs
      - name: Drag stays on one control point (no dependencies)
        run: node tests/direct-point-drag-regression.mjs
      - name: Open draft rescue and autosave failure (no dependencies)
        run: node tests/draft-rescue-regression.mjs
      - name: Frame empty plot and lone restored station (no dependencies)
        run: node tests/station-framing-regression.mjs
      - name: Empty node controls and station ownership (no dependencies)
        run: node tests/empty-panel-station-regression.mjs
      - name: Touch bank grip pixel size and desktop parity (no dependencies)
        run: node tests/touch-grip-size-regression.mjs
      - name: Install physics test dependency (not part of the game)
        run: npm install --no-save --no-package-lock three@0.160.0 playwright@1.56.1
      - name: Support clearance equivalence, including crossovers
        run: node tests/support-clearance-regression.mjs
      - name: Terrain proximity exactness and large-coaster performance
        run: node tests/terrain-distance-regression.mjs
      - name: Large-coaster node material pooling and disposal
        run: node tests/node-handle-material-regression.mjs
      - name: Curve-aware extension preview and on-rail point refinement
        run: node tests/curve-preview-refinement-regression.mjs
      - name: Physics and share regression tests
        run: node tests/physics-regression.mjs
      - name: Sample arc parameter caching and exact previous-geometry parity
        run: node tests/curve-parameter-cache-regression.mjs
      - name: Honest ride insights and clean lap restarts
        run: node tests/ride-insight-regression.mjs
      - name: Bank grip follows mobile camera zoom without track rebuild
        run: node tests/touch-grip-camera-regression.mjs
      - name: All touch hit proxies follow camera zoom without new meshes
        run: node tests/touch-halo-camera-regression.mjs
      - name: Install test-only Chromium
        # GitHub's Ubuntu 24.04 image already ships the runtime libraries.
        # Only the headless shell is used; avoid a full apt transaction on
        # every PR, which can stall for minutes on transient package mirrors.
        run: npx playwright install chromium --only-shell
      - name: Desktop and mobile WebGL browser smoke
        run: node tests/browser-smoke.mjs
